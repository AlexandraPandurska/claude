<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #2a0a3e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    canvas {
      display: block;
      border-radius: 16px;
      box-shadow: 0 0 50px rgba(255, 100, 180, 0.5);
      cursor: crosshair;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 480, H = 660;
canvas.width = W; canvas.height = H;

// ── State ────────────────────────────────────────────────────────
let state = 'START'; // START | PLAYING | LEVELUP | GAMEOVER
let score, level, lives, kills;
let flowers, hearts, particles, player;
let fireTimer, spawnTimer, fireColorIdx;
let invincible, levelUpTimer;
let lastTime = 0;

// ── Input ────────────────────────────────────────────────────────
const keys = {};
let mouseX = W / 2, lastMouseTime = -9999;

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = (e.clientX - r.left) * (W / r.width);
  lastMouseTime = performance.now();
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  mouseX = (e.touches[0].clientX - r.left) * (W / r.width);
  lastMouseTime = performance.now();
}, { passive: false });
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (state === 'START' || state === 'GAMEOVER') startGame();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('click', () => {
  if (state === 'START' || state === 'GAMEOVER') startGame();
});

// ── Constants ────────────────────────────────────────────────────
const PLAYER_SPEED  = 280;
const FIRE_INTERVAL = 200;  // ms between shots
const FLOWER_SPEED  = 430;  // px/s upward
const PLAYER_Y = H - 80;
const PLAYER_R = 22;
const FLOWER_TYPES = [
  { petal: '#FFE566', center: '#FFAA00' }, // daisy
  { petal: '#FFB3D1', center: '#E94560' }, // rose
  { petal: '#D4ABFF', center: '#9B5DE5' }, // lavender
];

// ── Game init ────────────────────────────────────────────────────
function startGame() {
  score = 0; level = 1; lives = 5; kills = 0;
  flowers = []; hearts = []; particles = [];
  player = { x: W / 2, y: PLAYER_Y };
  fireTimer = 0; spawnTimer = 0; fireColorIdx = 0;
  invincible = 0; levelUpTimer = 0;
  state = 'PLAYING';
}

// ── Game loop ────────────────────────────────────────────────────
function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  update(dt * 1000, dt);
  draw();
  requestAnimationFrame(loop);
}

// ── Update ───────────────────────────────────────────────────────
function update(ms, dt) {
  if (state === 'LEVELUP') {
    levelUpTimer -= ms;
    if (levelUpTimer <= 0) state = 'PLAYING';
    updateParticles(dt);
    return;
  }
  if (state !== 'PLAYING') return;

  // Player movement: mouse or keyboard (mouse takes over when cursor moves)
  if (performance.now() - lastMouseTime < 100) {
    player.x += (mouseX - player.x) * Math.min(1, dt * 14);
  }
  if (keys['ArrowLeft']  || keys['KeyA']) player.x -= PLAYER_SPEED * dt;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += PLAYER_SPEED * dt;
  player.x = Math.max(20, Math.min(W - 20, player.x));

  // Auto-fire
  fireTimer += ms;
  if (fireTimer >= FIRE_INTERVAL) {
    fireTimer -= FIRE_INTERVAL;
    const t = FLOWER_TYPES[fireColorIdx % FLOWER_TYPES.length];
    fireColorIdx++;
    flowers.push({ x: player.x, y: player.y - 22, vy: -FLOWER_SPEED, r: 9, ...t });
  }

  // Spawn hearts
  spawnTimer += ms;
  const spawnInterval = Math.max(500, 1200 - (level - 1) * 100);
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    const hp     = level >= 4 ? 2 : 1;
    const wobble = level >= 5 && Math.random() < 0.55 ? (Math.random() * 0.5 + 0.3) : 0;
    hearts.push({
      x: 32 + Math.random() * (W - 64), y: -28,
      vy: 70 + level * 12,
      wobble, wobbleT: Math.random() * Math.PI * 2,
      hp, maxHp: hp, r: 22,
    });
  }

  // Move flowers; cull off-screen
  for (let i = flowers.length - 1; i >= 0; i--) {
    flowers[i].y += flowers[i].vy * dt;
    if (flowers[i].y < -20) flowers.splice(i, 1);
  }

  // Move hearts + collisions
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i];
    h.wobbleT += dt * 2.5;
    if (h.wobble) h.x += Math.sin(h.wobbleT) * h.wobble * 60 * dt;
    h.x = Math.max(h.r, Math.min(W - h.r, h.x));
    h.y += h.vy * dt;

    if (h.y > H + 30) {
      hearts.splice(i, 1);
      loseLife();
      continue;
    }

    // Flower hits heart
    let died = false;
    for (let j = flowers.length - 1; j >= 0; j--) {
      const f = flowers[j];
      if (dist2(f.x, f.y, h.x, h.y) < (f.r + h.r) ** 2) {
        flowers.splice(j, 1);
        if (--h.hp <= 0) {
          spawnBurst(h.x, h.y);
          hearts.splice(i, 1);
          score += 10 * level;
          kills++;
          if (kills % 10 === 0) {
            level++;
            levelUpTimer = 1600;
            state = 'LEVELUP';
          }
          died = true;
          break;
        }
      }
    }
    if (died) continue;

    // Heart reaches player
    if (invincible <= 0 && dist2(player.x, player.y, h.x, h.y) < (PLAYER_R + h.r - 8) ** 2) {
      hearts.splice(i, 1);
      loseLife();
    }
  }

  if (invincible > 0) invincible -= ms;
  updateParticles(dt);
}

function dist2(ax, ay, bx, by) { return (ax - bx) ** 2 + (ay - by) ** 2; }

function loseLife() {
  if (invincible > 0) return;
  lives--;
  invincible = 1500;
  if (lives <= 0) state = 'GAMEOVER';
}

function spawnBurst(x, y) {
  const COLS = ['#FFD700', '#FF9DC6', '#ffffff', '#C9A0E8', '#FF6B9D'];
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + Math.random() * 0.4;
    const s = 70 + Math.random() * 110;
    particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      r: 3 + Math.random() * 4, life: 1,
      color: COLS[Math.floor(Math.random() * COLS.length)],
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.93;     p.vy *= 0.93;
    p.life -= dt * 2.2;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// ── Draw ─────────────────────────────────────────────────────────
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#fce4ec');
  g.addColorStop(1, '#ede7f6');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function draw() {
  drawBg();
  if (state === 'START')    { drawStartScreen();    return; }
  if (state === 'GAMEOVER') { drawGameOverScreen(); return; }

  particles.forEach(drawParticle);
  flowers.forEach(f => drawFlowerShape(f.x, f.y, f.petal, f.center, f.r));
  hearts.forEach(drawHeart);

  const blink = invincible > 0 && Math.floor(invincible / 140) % 2 === 1;
  if (!blink) drawGirl(player.x, player.y);

  drawHUD();

  if (state === 'LEVELUP') {
    ctx.save();
    ctx.globalAlpha = Math.min(1, levelUpTimer / 600);
    ctx.font = 'bold 50px "Comic Sans MS", cursive';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#9B5DE5';
    ctx.shadowColor = 'white'; ctx.shadowBlur = 22;
    ctx.fillText(`✨ Level ${level}! ✨`, W / 2, H / 2);
    ctx.restore();
  }
}

// ── Girl sprite ──────────────────────────────────────────────────
function drawGirl(x, y) {
  ctx.save();
  ctx.translate(x, y);

  // Legs
  ctx.strokeStyle = '#FDBCB4'; ctx.lineWidth = 8; ctx.lineCap = 'round';
  line(-8, 18, -10, 38); line(8, 18, 10, 38);

  // Shoes
  ctx.fillStyle = '#6B3A2A';
  ellipse(-10, 40, 8, 4); ellipse(10, 40, 8, 4);

  // Dress skirt
  ctx.beginPath();
  ctx.moveTo(-16, -8); ctx.lineTo(-25, 20); ctx.lineTo(25, 20); ctx.lineTo(16, -8);
  ctx.closePath();
  ctx.fillStyle = '#FF85A1'; ctx.fill();

  // Dress bodice
  ctx.beginPath(); ctx.ellipse(0, -13, 14, 10, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#FF6B9D'; ctx.fill();

  // Arms
  ctx.strokeStyle = '#FDBCB4'; ctx.lineWidth = 7;
  line(-13, -10, -27, -25); line(13, -10, 27, -25);

  // Flowers at hands
  drawFlowerShape(-27, -25, '#FFE566', '#FFAA00', 7);
  drawFlowerShape( 27, -25, '#FFB3D1', '#E94560', 7);

  // Head
  ctx.beginPath(); ctx.arc(0, -30, 16, 0, Math.PI * 2);
  ctx.fillStyle = '#FDBCB4'; ctx.fill();

  // Hair (back)
  ctx.beginPath(); ctx.arc(0, -32, 17, Math.PI, 0);
  ctx.fillStyle = '#6B3A2A'; ctx.fill();

  // Pigtails
  ctx.beginPath(); ctx.arc(-20, -27, 9, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc( 20, -27, 9, 0, Math.PI * 2); ctx.fill();

  // Bow
  ctx.fillStyle = '#E94560';
  ctx.beginPath(); ctx.moveTo(-1,-47); ctx.bezierCurveTo(-13,-53,-13,-42,-1,-47); ctx.fill();
  ctx.beginPath(); ctx.moveTo( 1,-47); ctx.bezierCurveTo( 13,-53, 13,-42, 1,-47); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -47, 3.5, 0, Math.PI * 2);
  ctx.fillStyle = '#FF6B9D'; ctx.fill();

  // Eyes
  ctx.fillStyle = '#3a1a0a';
  ctx.beginPath(); ctx.arc(-5.5, -31, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc( 5.5, -31, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(-4.5, -32.2, 1.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc( 6.5, -32.2, 1.3, 0, Math.PI * 2); ctx.fill();

  // Smile
  ctx.beginPath(); ctx.arc(0, -26, 7, 0.25, Math.PI - 0.25);
  ctx.strokeStyle = '#bf6040'; ctx.lineWidth = 2; ctx.stroke();

  // Blush
  ctx.globalAlpha = 0.35; ctx.fillStyle = '#FF69B4';
  ctx.beginPath(); ctx.arc(-10, -25, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc( 10, -25, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  ctx.restore();
}

// ── Flower shape (reused for projectiles and player's hands) ──────
function drawFlowerShape(x, y, petalColor, centerColor, r) {
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, r * 0.65, 0, Math.PI * 2);
    ctx.fillStyle = petalColor; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(x, y, r * 0.7, 0, Math.PI * 2);
  ctx.fillStyle = centerColor; ctx.fill();
}

// ── Heart enemy ───────────────────────────────────────────────────
function heartPath() {
  ctx.beginPath();
  ctx.moveTo(0, 8);
  ctx.bezierCurveTo(-22, -5, -22, -20, 0, -13);
  ctx.bezierCurveTo( 22, -20,  22, -5, 0,   8);
  ctx.closePath();
}

function drawHeart(h) {
  ctx.save();
  ctx.translate(h.x, h.y);
  ctx.scale(h.r / 22, h.r / 22);

  heartPath();
  ctx.fillStyle   = h.hp < h.maxHp ? '#FFB3C6' : '#FF4B6E';
  ctx.shadowColor = 'rgba(255,75,110,0.5)';
  ctx.shadowBlur  = 10;
  ctx.fill();

  ctx.beginPath(); ctx.arc(-8, -10, 5, 0, Math.PI * 2);
  ctx.fillStyle  = 'rgba(255,255,255,0.28)';
  ctx.shadowBlur = 0;
  ctx.fill();

  ctx.restore();
}

// ── Sparkle particle ──────────────────────────────────────────────
function drawParticle(p) {
  ctx.save();
  ctx.globalAlpha = Math.max(0, p.life);
  ctx.beginPath();
  ctx.arc(p.x, p.y, Math.max(0.1, p.r * p.life), 0, Math.PI * 2);
  ctx.fillStyle = p.color; ctx.fill();
  ctx.restore();
}

// ── HUD ───────────────────────────────────────────────────────────
function drawHUD() {
  // Life hearts
  for (let i = 0; i < 5; i++) {
    ctx.save(); ctx.translate(16 + i * 26, 22); ctx.scale(0.62, 0.62);
    heartPath();
    ctx.fillStyle = i < lives ? '#FF4B6E' : 'rgba(255,75,110,0.18)';
    ctx.fill();
    ctx.restore();
  }

  ctx.font = 'bold 19px "Comic Sans MS", cursive';
  ctx.textAlign = 'center'; ctx.fillStyle = '#5a2068';
  ctx.fillText(`Score: ${score}`, W / 2, 26);

  ctx.textAlign = 'right';
  ctx.fillText(`Lvl ${level}`, W - 10, 26);
}

// ── Screens ───────────────────────────────────────────────────────
function drawStartScreen() {
  ctx.font = 'bold 58px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#E94560';
  ctx.shadowColor = 'rgba(233,69,96,0.4)'; ctx.shadowBlur = 20;
  ctx.fillText('Flower',  W / 2, 165);
  ctx.fillText('Shooter', W / 2, 232);
  ctx.shadowBlur = 0;

  ctx.font = '20px "Comic Sans MS", cursive';
  ctx.fillStyle = '#7b3fa0';
  ctx.fillText('Stop the hearts with your flowers!', W / 2, 287);

  ctx.font = '17px "Comic Sans MS", cursive';
  ctx.fillStyle = '#a060a0';
  ctx.fillText('Move with mouse or arrow keys', W / 2, 330);
  ctx.fillText('Flowers fire automatically — good luck!', W / 2, 358);

  ctx.font = 'bold 21px "Comic Sans MS", cursive';
  ctx.fillStyle = '#E94560';
  ctx.fillText('Click or press any key to start', W / 2, 418);

  drawGirl(W / 2, 555);
}

function drawGameOverScreen() {
  ctx.font = 'bold 52px "Comic Sans MS", cursive';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#E94560';
  ctx.shadowColor = 'rgba(233,69,96,0.4)'; ctx.shadowBlur = 16;
  ctx.fillText('Game Over!', W / 2, H / 2 - 90);
  ctx.shadowBlur = 0;

  ctx.font = '28px "Comic Sans MS", cursive';
  ctx.fillStyle = '#5a2068';
  ctx.fillText(`Score: ${score}`,          W / 2, H / 2 - 28);
  ctx.fillText(`Level reached: ${level}`,  W / 2, H / 2 + 20);
  ctx.fillText(`Hearts defeated: ${kills}`, W / 2, H / 2 + 68);

  ctx.font = 'bold 20px "Comic Sans MS", cursive';
  ctx.fillStyle = '#9B5DE5';
  ctx.fillText('Click or press any key to play again', W / 2, H / 2 + 138);
}

// ── Canvas helpers ────────────────────────────────────────────────
function line(x1, y1, x2, y2) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function ellipse(x, y, rx, ry) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
}

// ── Boot ──────────────────────────────────────────────────────────
lastTime = performance.now();
requestAnimationFrame(loop);
</script>
</body>
</html>
